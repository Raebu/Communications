name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: communications_test
          POSTGRES_USER: communications_test
          POSTGRES_PASSWORD: ci_database_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U communications_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests migrations
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://communications_test:ci_database_password@localhost:5432/communications_test
      - run: node --check app/static/app.js
      - run: bash -n deployment/deploy.sh deployment/backup.sh deployment/check.sh
      - run: docker run --rm -e SERVICE_HOSTNAME=localhost -v "$PWD/deployment/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine caddy adapt --config /etc/caddy/Caddyfile --validate
      - run: docker build -t communications:test .
