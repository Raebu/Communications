# Standalone production stack for Supabase or another managed PostgreSQL service.
# Do not merge with compose.yaml: this stack deliberately has no local database.
services:
  migrate:
    build: .
    env_file: .env
    command: [python, -m, alembic, upgrade, head]
  api:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    env_file: .env
    command: [python, -m, app.worker]
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
  proxy:
    image: caddy:2.10-alpine
    environment:
      SERVICE_HOSTNAME: ${SERVICE_HOSTNAME:?Set SERVICE_HOSTNAME to your DNS hostname}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
